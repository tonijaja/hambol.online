<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMBOL</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/atVD9rQ.png">
<style>

  :root {
    --font-opciones: "Helvetica Bold", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --color-opciones: #e00505;
    --color-hover: #ff0000;
    --tamano-gif: 60vw;
    --max-gif: 500px;
    --ancho-fuente: 0.7;
  }


  body {
    background-color: white;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 77%;
    height: 100%;
  }

  #media-wrap {
    width: var(--tamano-gif);
    max-width: var(--max-gif);
    position: relative;
  }

  /* imagen de referencia invisible que mantiene el alto del contenedor */
  #media-wrap::after {
    content: '';
    display: block;
    padding-top: 94%; /* aspect ratio aproximado de las imágenes — ajustá si hace falta */
  }

  #main-video,
  .hover-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: opacity 0.05s;
  }

  .hover-img {
    opacity: 0;
    pointer-events: none;
  }


  .options {
    display: flex;
    gap: -5.6rem;
    margin-top: 2rem;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    flex-direction: row;
  }

  .option {
    text-decoration: none;
    color: var(--color-opciones);
    font-size: 2.4rem;
    font-family: var(--font-opciones);
    font-weight: 760;
    letter-spacing: -4px;
    transform: scaleX(var(--ancho-fuente));
    display: inline-block;
    transition:
      transform 0s ease,
      color 0.1s ease;
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0);
    padding: 0.05rem 0.4rem;
  }

  .option:hover {
    transform: scaleX(var(--ancho-fuente)) scale(1.1) rotate(2deg);
    color: var(--color-hover);
  }


  @media (max-width: 768px) {
    .container {
      margin-top: 5vh;
    }

    #media-wrap {
      width: 92vw;
      max-width: 606px;
    }

    .options {
      flex-direction: column;
      gap: 0.1rem;
      margin-top: 0.6rem;
    }

    .option {
      font-size: 7.4rem;
      letter-spacing: -2px;
      padding: 0rem 1rem;
    }

    .option:hover {
      transform: scale(1.02);
    }
  }

  @media (orientation: portrait) {
    .container {
      margin-top: 9vh;
    }

    #media-wrap {
      width: 92vw;
      max-width: 606px;
    }

    .option {
      font-size: 3rem;
    }
  }
</style>
</head>
<body>
  <div class="container">

    <!-- contenedor para video + imagen hover, mismo tamaño -->
    <div id="media-wrap">
      <video id="main-video" autoplay loop muted playsinline>
        <source src="ezgif-8b079ad726d7d9cc.webm" type="video/webm">
      </video>
      <img class="hover-img" data-key="escuchanos" src="escuchanos.png" alt="Escuchanos">
      <img class="hover-img" data-key="videos"      src="videos.png"      alt="Videos">
      <img class="hover-img" data-key="merch"       src="merch.png"       alt="Merch">
      <img class="hover-img" data-key="shows"       src="shows.png"       alt="Shows">
    </div>

    <div class="options">
      <a href="https://open.spotify.com/intl-es/artist/6PwAPD6MdbeANzrK0MwpNC?si=-uQtBzcVSzeolHMy10Q00w" class="option" onmouseover="changeGif('escuchanos')" onmouseout="resetGif()">ESCUCHANOS</a>
      <a href="https://www.youtube.com/@hambol" class="option" onmouseover="changeGif('videos')" onmouseout="resetGif()">VIDEOS</a>
      <a href="merch.html" class="option" onmouseover="changeGif('merch')" onmouseout="resetGif()">MERCH</a>
      <a href="shows.html" class="option" onmouseover="changeGif('shows')" onmouseout="resetGif()">SHOWS</a>
    </div>
  </div>

  <script>
    const mainVideo = document.getElementById("main-video");
    const hoverImg  = document.getElementById("hover-img");

    const imgs = document.querySelectorAll('.hover-img');

    // Forzar autoplay en mobile al primer toque
    document.addEventListener('touchstart', function() {
      mainVideo.play();
    }, { once: true });

    function changeGif(key) {
      imgs.forEach(img => {
        img.style.opacity = img.dataset.key === key ? "1" : "0";
      });
      mainVideo.style.opacity = "0";
    }

    function resetGif() {
      imgs.forEach(img => img.style.opacity = "0");
      mainVideo.style.opacity = "1";
      mainVideo.currentTime = 0;
      mainVideo.play();
    }
  </script>

</body>
</html>
